items:
  - kind: pipeline
    name: agent-probe
    displayName: "Agent probe"
    definition:
      script: |
        pipeline { agent { label 'smoke-a-default' }
          stages { stage('Cred') { steps { withCredentials([string(credentialsId: 'smoke-a-secret', variable: 'S')]) { sh 'echo have secret; printenv S | wc -c' } } } } }
  - kind: pipeline
    name: fast-probe
    displayName: "Fast probe"
    properties:
      - durabilityHint:
          hint: PERFORMANCE_OPTIMIZED
    definition:
      script: |
        pipeline { agent { label 'smoke-a-default' }
          stages { stage('Run') { steps { echo 'fast probe' } } } }
  - kind: pipeline
    name: slow-probe
    displayName: "Slow probe"
    definition:
      script: |
        pipeline { agent { label 'smoke-a-default' }
          stages { stage('Sleep') { steps { sh 'echo slow probe; sleep 100' } } } }
  - kind: pipeline
    name: lock-hold
    displayName: "Lock hold"
    definition:
      script: |
        pipeline { agent { label 'smoke-a-default' }
          stages { stage('Lock') { steps { script {
            varroa.lock(name: 'smoke-lock', timeout: 600) { sh 'echo holding smoke-lock; sleep 150' }
          } } } } }
  - kind: pipeline
    name: digest-probe
    displayName: "Digest probe"
    definition:
      script: |
        pipeline { agent { label 'smoke-a-default' }
          stages {
            stage('Note') { steps { script { varroa.summary('canary at 10%, holding for the gate') } } }
            stage('Deploy') { steps { sh 'echo deploying canary; echo gate refused the canary; exit 1' } }
          } }
  - kind: pipeline
    name: input-probe
    displayName: "Input probe"
    definition:
      script: |
        pipeline { agent { label 'smoke-a-default' }
          stages {
            stage('Gate') { steps { script {
              def env = input message: 'Deploy?', ok: 'Ship it', submitter: 'bambash',
                parameters: [choice(name: 'ENV', choices: ['staging', 'prod'])]
              echo "ENV=" + env
            } } }
            stage('Deploy') { steps { sh 'echo deploying' } }
          } }
  - kind: pipeline
    name: input-refuse
    displayName: "Input refuse probe"
    definition:
      script: |
        pipeline { agent { label 'smoke-a-default' }
          stages {
            stage('Gate') { steps { script {
              input message: 'Only release managers may answer', ok: 'Approve', submitter: 'varroa-release-managers'
            } } }
          } }
  - kind: pipeline
    name: junit-probe
    displayName: "JUnit probe"
    definition:
      script: |
        pipeline { agent { label 'smoke-a-default' }
          stages {
            stage('Test') { steps { script {
              writeFile file: 'results.xml', text: '''<?xml version="1.0" encoding="UTF-8"?>
        <testsuite name="smoke.junit" tests="3" failures="1" skipped="1">
          <testcase classname="com.example.SmokeTest" name="passes" time="0.25"/>
          <testcase classname="com.example.SmokeTest" name="fails" time="1.25">
            <failure message="expected 1 but was 2">java.lang.AssertionError: expected 1 but was 2
            at com.example.SmokeTest.fails(SmokeTest.java:12)</failure>
          </testcase>
          <testcase classname="com.example.SmokeTest" name="skips" time="0.0">
            <skipped message="not on this platform"/>
          </testcase>
        </testsuite>
        '''
              junit 'results.xml'
            } } }
          } }
  - kind: pipeline
    name: rehydrate-1
    displayName: "Rehydrate probe"
    parameters:
      - string:
          name: ENV
          defaultValue: staging
    definition:
      script: |
        pipeline { agent { label 'smoke-a-default' }
          stages { stage('Run') { steps { echo "env=" + params.ENV } } } }
  - kind: pipeline
    name: release
    displayName: "Release"
    parameters:
      - string:
          name: VERSION
          defaultValue: "1.4.0"
    definition:
      script: |
        pipeline {
          agent { label 'smoke-a-default' }
          stages {
            stage('Prepare') { steps { sh 'echo prepare release ' + params.VERSION + '; sleep 2' } }
            stage('Build') {
              parallel {
                stage('api') { steps { sh 'echo build api; sleep 4' } }
                stage('web') { steps { sh 'echo build web; sleep 3' } }
                stage('worker') { steps { sh 'echo build worker; sleep 5' } }
              }
            }
            stage('Tag') { steps { sh 'echo tag v' + params.VERSION } }
          }
        }
  - kind: folder
    name: payments
    displayName: "Payments"
    items:
      - kind: folder
        name: api
        displayName: "API"
        items:
          - kind: pipeline
            name: build
            displayName: "Build"
            properties:
              - buildDiscarder:
                  strategy:
                    logRotator:
                      numToKeep: 30
            definition:
              script: |
                pipeline {
                  agent { label 'smoke-a-default' }
                  stages {
                    stage('Checkout') { steps { sh 'echo checkout payments/api; sleep 1' } }
                    stage('Compile') { steps { sh 'echo go build ./...; sleep 6' } }
                    stage('Unit tests') { steps { sh 'echo go test ./...; sleep 4' } }
                    stage('Package') { steps { sh 'echo docker build; sleep 3' } }
                  }
                }
          - kind: pipeline
            name: test
            displayName: "Integration tests"
            definition:
              script: |
                pipeline {
                  agent { label 'smoke-a-default' }
                  stages {
                    stage('Postgres') { steps { sh 'echo start postgres; sleep 3' } }
                    stage('Run') {
                      steps {
                        sh 'echo integration suite; sleep 5'
                        script { if (env.BUILD_NUMBER.toInteger() % 3 == 0) { unstable('two flaky tests') } }
                      }
                    }
                  }
                }
          - kind: pipeline
            name: deploy
            displayName: "Deploy"
            parameters:
              - choice:
                  name: ENV
                  choices:
                    - staging
                    - production
              - booleanParam:
                  name: DRY_RUN
                  defaultValue: true
            definition:
              script: |
                pipeline {
                  agent { label 'smoke-a-default' }
                  stages {
                    stage('Plan') { steps { sh 'echo plan ' + params.ENV + ' dry_run=' + params.DRY_RUN + '; sleep 2' } }
                    stage('Apply') {
                      when { expression { !params.DRY_RUN } }
                      steps { sh 'echo apply ' + params.ENV + '; sleep 4' }
                    }
                    stage('Smoke') { steps { sh 'echo curl /healthz; sleep 2' } }
                  }
                }
      - kind: folder
        name: web
        displayName: "Web"
        items:
          - kind: pipeline
            name: build
            displayName: "Build"
            definition:
              script: |
                pipeline {
                  agent { label 'smoke-a-default' }
                  stages {
                    stage('Install') { steps { sh 'echo npm ci; sleep 4' } }
                    stage('Lint') { steps { sh 'echo eslint; sleep 2' } }
                    stage('Bundle') { steps { sh 'echo vite build; sleep 5' } }
                  }
                }
          - kind: pipeline
            name: e2e
            displayName: "End-to-end"
            definition:
              script: |
                pipeline {
                  agent { label 'smoke-a-default' }
                  stages {
                    stage('Browser') { steps { sh 'echo playwright; sleep 4' } }
                    stage('Verdict') {
                      steps {
                        script { if (env.BUILD_NUMBER.toInteger() % 2 == 0) { error('checkout flow timed out') } }
                        sh 'echo all green'
                      }
                    }
                  }
                }
  - kind: folder
    name: platform
    displayName: "Platform"
    items:
      - kind: pipeline
        name: terraform-plan
        displayName: "Terraform plan"
        parameters:
          - string:
              name: WORKSPACE
              defaultValue: core
        definition:
          script: |
            pipeline {
              agent { label 'smoke-a-default' }
              stages {
                stage('Init') { steps { sh 'echo terraform init ' + params.WORKSPACE + '; sleep 2' } }
                stage('Plan') { steps { sh 'echo terraform plan; sleep 6' } }
              }
            }
      - kind: pipeline
        name: nightly-audit
        displayName: "Nightly audit"
        triggers:
          - cron:
              spec: "H 2 * * *"
        definition:
          script: |
            pipeline {
              agent { label 'smoke-a-default' }
              stages {
                stage('Scan') { steps { sh 'echo trivy fs .; sleep 5' } }
                stage('Report') { steps { sh 'echo report; sleep 1' } }
              }
            }
      - kind: pipeline
        name: cert-rotate
        displayName: "Certificate rotation"
        definition:
          script: |
            pipeline {
              agent { label 'smoke-a-default' }
              stages {
                stage('Rotate') { steps { sh 'echo rotate; sleep 3' } }
              }
            }
  - kind: pipeline
    name: mesh-flow
    displayName: "Mesh probe: flow only"
    definition:
      script: |
        for (int i = 1; i <= 24; i++) {
          stage('s' + i) {
            echo 'stage ' + i + ' start'
            sleep 30
            echo 'stage ' + i + ' end'
          }
        }
        echo 'flow-done'
  - kind: pipeline
    name: mesh-agent
    displayName: "Mesh probe: pod agent"
    definition:
      script: |
        stage('prep') { echo 'prep'; sleep 5 }
        node('smoke-a-default') {
          stage('work') {
            sh 'hostname'
            for (int i = 1; i <= 20; i++) {
              sh 'sleep 30'
              echo 'tick ' + i
            }
            sh 'echo done-on-agent'
          }
        }
        stage('after') { echo 'after-node' }
  - kind: pipeline
    name: mesh-perf
    displayName: "Mesh probe: durability override"
    definition:
      script: |
        properties([durabilityHint('PERFORMANCE_OPTIMIZED')])
        for (int i = 1; i <= 24; i++) {
          stage('p' + i) { sleep 30 }
        }
        echo 'perf-done'
  - kind: folder
    name: source
    displayName: "Source probe"
    properties:
      - folderLibraries:
          libraries:
            - libraryConfiguration:
                name: smoke-lib
                allowVersionOverride: true
                retriever:
                  modernSCM:
                    scm:
                      github:
                        repoOwner: bambash
                        repository: varroa-jenkins-controllers
    items:
      - kind: pipeline
        name: probe
        displayName: "Source probe"
        definition:
          cpsScmFlowDefinition:
            scriptPath: fixtures/source-probe/Jenkinsfile
            lightweight: true
            scm:
              gitSCM:
                userRemoteConfigs:
                  - userRemoteConfig:
                      url: https://github.com/bambash/varroa-jenkins-controllers.git
                branches:
                  - branchSpec:
                      name: "*/smoke-cells"
      - kind: pipeline
        name: probe-node
        displayName: "Source probe (checkout on the agent)"
        definition:
          script: |
            pipeline {
              agent { label 'smoke-a-default' }
              stages {
                stage('Checkout') {
                  steps {
                    git url: 'https://github.com/bambash/varroa-jenkins-controllers.git', branch: 'smoke-cells'
                    sh 'echo source probe on the agent; sleep 45'
                  }
                }
              }
            }
