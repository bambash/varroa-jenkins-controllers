apiVersion: "1"
name: smoke-template-catalog
description: "Throwaway catalog for the jenkins-cells epic live smoke."
items:
  - type: podtemplate
    name: smoke-idle-pod
    displayName: "Idle pod template (smoke)"
    path: items/smoke-idle-pod.yaml
    version: "1.0.0"
    tags: [smoke]
  - type: pipeline-template
    name: go-service
    displayName: "Go service (smoke)"
    path: items/go-service.yaml
    version: "2.1.3"
    tags: [smoke]
  - type: item
    name: smoke-a-jobs
    displayName: "Smoke tenant jobs"
    path: items/smoke-a-jobs.yaml
    version: "1.6.16"
    tags: [smoke]
  - type: item
    name: smoke-b-jobs
    displayName: "Smoke tenant jobs (smoke-b)"
    path: items/smoke-b-jobs.yaml
    version: "1.4.10"
    tags: [smoke]
